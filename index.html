<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Word Formation — Apply / Appreciate / Argue / Arrange / Arrive</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 900px;
    width: 100%;
    background: #fff;
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #2c3e50;
    margin: 0 0 6px 0;
  }
  .subtitle {
    text-align: center;
    color: #7f8c8d;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid #e0e6ed;
  }
  .tab-btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid #c5ddf0;
    background: #fff;
    color: #2c3e50;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
</html>
